<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arena17 Downloads{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <header><a href="{{ url_for('public.index') }}">Arena17 · Winning Eleven 2002</a>{% if session.user_id %}<a class="admin-link" href="{{ url_for('admin.dashboard') }}">Administração</a>{% endif %}</header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Arquivos oficiais dos campeonatos Arena17.</footer>
</body>
</html>
