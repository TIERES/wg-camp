{% extends 'base.html' %}{% block title %}Reenviar confirmação · Campeonatos WE 2002{% endblock %}{% block content %}
<section class="login account-form">
  <h1>Reenviar confirmação</h1>
  <p>Informe o e-mail usado no cadastro para receber um novo link de confirmação.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
    <button>Reenviar</button>
  </form>
</section>
{% endblock %}
