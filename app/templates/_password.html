{# Botão de olho que mostra/esconde a senha do campo ao lado (static/js/password-toggle.js).
   Vai dentro de um .input-icon, depois do <input type="password">. #}
{% macro password_toggle() -%}
<button type="button" class="password-toggle" data-password-toggle aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false">
  <svg class="ico eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="ico eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2"/><path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
</button>
{%- endmacro %}
