{% extends 'base.html' %}{% block content %}
<div class="page-title"><h1>Editar replay</h1><a href="{{ url_for('admin.replays_list') }}">Voltar</a></div>
<p><strong>{{ replay.game_name }}</strong> · {{ replay.started_at[:16] | replace('T', ' ') }} · {{ replay.duration_seconds | duration }}</p>
<form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Jogadores<input name="player_names" value="{{ replay.player_names }}" maxlength="255"></label>
<button>Salvar</button>
</form>
{% endblock %}
