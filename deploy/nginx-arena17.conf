# Substitua downloads.exemplo.com pelo domínio real e habilite TLS antes de publicar.
server {
    listen 80;
    server_name _;

    client_max_body_size 8g;
    client_body_temp_path /var/www/arena17/uploads-tmp/nginx 1 2;

    # Só o Flask pode encaminhar usuários para esta localização. O Nginx envia
    # o conteúdo com X-Accel-Redirect, sem colocá-lo na memória do Python.
    location /_protected_downloads/ {
        internal;
        alias /var/www/arena17/downloads/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        # Nginx suporta Range por padrão: pausas e retomadas funcionam no navegador.
        # limit_conn per_ip 2; e limit_rate 8m; são opções para ativar se necessário.
    }

    # Idem, para os replays (.krec) das partidas jogadas ("/spectate/ingest").
    location /_protected_replays/ {
        internal;
        alias /var/www/arena17/live/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        alias /opt/arena17-downloads/app/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://unix:/run/arena17-downloads/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
